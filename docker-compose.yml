services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peritos
      POSTGRES_USER: peritos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_KEY: ${API_KEY:?Defina API_KEY en .env}
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: peritos
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      DB_NAME: peritos
    ports:
      - "3000:3000"

volumes:
  postgres_data:
